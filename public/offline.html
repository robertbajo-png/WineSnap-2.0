<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline — WineSnap</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0709;
        color: #f2e9e4;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        color: #b9a7a7;
        font-size: 14px;
        max-width: 22rem;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-512.png" alt="WineSnap" />
      <h1>You're offline</h1>
      <p>
        WineSnap needs a connection to scan labels and load your cellar. Reconnect and try again.
      </p>
      <p style="margin-top: 16px"><a href="/" style="color: #d7b46e" id="retry">Try again</a></p>
    </main>
    <script>
      let lang;
      try {
        lang = localStorage.getItem("lang");
      } catch {}
      if (lang === "sv" || (!lang && navigator.language.startsWith("sv"))) {
        document.documentElement.lang = "sv";
        document.querySelector("h1").textContent = "Du är offline";
        document.querySelector("p").textContent =
          "WineSnap behöver uppkoppling för att skanna etiketter och läsa din källare. Dina uppgifter är inte tillgängliga offline.";
        document.getElementById("retry").textContent = "Försök igen";
      }
    </script>
  </body>
</html>
