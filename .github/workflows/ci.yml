name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Check Edge Functions with Deno
        run: >-
          deno check --no-config --no-lock
          supabase/functions/analyze-wine/index.ts
          supabase/functions/restaurant-match/index.ts
          supabase/functions/taste-suggestions/index.ts
          supabase/functions/wine-suggestions/index.ts
      - run: bun run test
      - run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder
