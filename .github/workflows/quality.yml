name: Quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run test:bundle
      - run: npm run build:chef
      - name: Build independent Node candidate with synthetic configuration
        run: npm run build:independent:check
        env:
          SUPABASE_SERVICE_ROLE_KEY: independent-check-private-canary-must-not-be-public
          LOVABLE_API_KEY: independent-check-private-canary-must-not-be-public
          VITE_UNKNOWN_SECRET: independent-check-private-canary-must-not-be-public
          VITE_SUPABASE_URL: https://production-should-not-be-used.invalid
      - run: npm run test:independent
      - run: npm run test:bundle -- --independent
