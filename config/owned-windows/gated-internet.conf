pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream owned_web { zone owned_web 64k; server winesnap-owned-web:3000 resolve; }
  upstream owned_api { zone owned_api 64k; server winesnap-owned-gateway:8080 resolve; }
  upstream owned_gate { zone owned_gate 64k; server winesnap-owned-gate:9091 resolve; }
  map $http_origin $blocked_origin {
    default 1;
    "" 0;
    "https://winesnap.boleoai.se" 0;
  }
  map $uri $owned_proxy_host {
    default winesnap.boleoai.se;
    ~^/backend/ winesnap-owned-gateway;
  }
  map $uri $owned_proxy_origin {
    default $http_origin;
    ~^/backend/ "";
  }
  limit_req_zone $binary_remote_addr zone=owned_login:1m rate=6r/m;
  limit_conn_zone $binary_remote_addr zone=owned_login_active:1m;
  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 8080;
    server_name winesnap.boleoai.se;
    client_max_body_size 20m;
    if ($blocked_origin) { return 403; }
    auth_request /_owned_auth_check;
    auth_request_set $gate_cookie $upstream_http_set_cookie;
    auth_request_set $gate_redirect $upstream_http_location;
    error_page 401 = @gate_login;
    add_header Set-Cookie $gate_cookie always;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=300" always;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host winesnap.boleoai.se;
    proxy_set_header Host $owned_proxy_host;
    proxy_set_header Origin $owned_proxy_origin;
    proxy_set_header Cf-Access-Jwt-Assertion "";
    proxy_set_header Remote-User "";
    proxy_set_header Remote-Groups "";
    proxy_set_header Remote-Name "";
    proxy_set_header Remote-Email "";
    proxy_read_timeout 90s;
    proxy_redirect off;
    location = /_owned_auth_check {
      internal;
      auth_request off;
      proxy_pass http://owned_gate/api/authz/auth-request;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_next_upstream off;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization "";
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URL https://winesnap.boleoai.se$request_uri;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host winesnap.boleoai.se;
    }
    location @gate_login {
      auth_request off;
      return 302 $gate_redirect;
    }
    location = /gate { return 302 https://winesnap.boleoai.se/gate/; }
    location = /gate/api/firstfactor {
      auth_request off;
      client_max_body_size 4k;
      limit_conn owned_login_active 2;
      limit_conn_status 429;
      limit_req zone=owned_login burst=6 nodelay;
      limit_req_status 429;
      proxy_pass http://owned_gate;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host winesnap.boleoai.se;
    }
    location ^~ /gate/ {
      auth_request off;
      proxy_pass http://owned_gate;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Host winesnap.boleoai.se;
    }
    location ^~ /backend/auth/v1/admin { return 404; }
    location /backend/auth/v1/ { proxy_pass http://owned_api/auth/v1/; }
    location /backend/rest/v1/ { proxy_pass http://owned_api/rest/v1/; }
    location /backend/storage/v1/ { proxy_pass http://owned_api/storage/v1/; }
    location /backend/ { return 404; }
    location ^~ /api/public/hooks/ { return 404; }
    location ^~ /api/privacy/privacy-maintenance { return 404; }
    location / { proxy_pass http://owned_web; }
  }
}
