pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream owned_auth { zone owned_auth 64k; server winesnap-owned-auth:9999 resolve; }
  upstream owned_rest { zone owned_rest 64k; server winesnap-owned-rest:3000 resolve; }
  upstream owned_storage { zone owned_storage 64k; server winesnap-owned-storage:5000 resolve; }
  upstream owned_mail { zone owned_mail 64k; server winesnap-owned-mail:8025 resolve; }
  map $http_origin $blocked_origin {
    default 1;
    "" 0;
    "http://127.0.0.1:5212" 0;
    "http://localhost:5212" 0;
    "http://127.0.0.1:8026" 0;
    "http://localhost:8026" 0;
  }
  map $http_origin $cors_origin {
    default "";
    "http://127.0.0.1:5212" $http_origin;
    "http://localhost:5212" $http_origin;
  }
  server {
    listen 8080 default_server;
    listen 8081 default_server;
    server_name _;
    return 444;
  }
  server {
    listen 8080;
    server_name 127.0.0.1 localhost winesnap-owned-gateway;
    client_max_body_size 20m;
    if ($blocked_origin) { return 403; }
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-upsert, cache-control, range, range-unit, prefer, accept-profile, content-profile, x-supabase-api-version" always;
    add_header Access-Control-Expose-Headers "content-range, range, x-total-count" always;
    add_header Vary Origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 90s;
    proxy_redirect off;
    location = /health { return 200 'ok'; }
    location /auth/v1/ { proxy_pass http://owned_auth/; }
    location /rest/v1/ { proxy_pass http://owned_rest/; }
    location /storage/v1/ { proxy_pass http://owned_storage/; }
    location / { return 404; }
  }
  server {
    listen 8081;
    server_name 127.0.0.1 localhost;
    if ($blocked_origin) { return 403; }
    location / {
      proxy_pass http://owned_mail;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
